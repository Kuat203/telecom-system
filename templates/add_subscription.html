{% extends "base.html" %}
{% block content %}

<h2>Подключить клиента</h2>

<form method="post" class="mt-3">

<select name="client_id" class="form-control mb-2">
{% for c in clients %}
<option value="{{ c.id }}">{{ c.full_name }}</option>
{% endfor %}
</select>

<select name="tariff_id" class="form-control mb-2">
{% for t in tariffs %}
<option value="{{ t.id }}">{{ t.name }} — {{ t.price }} ₸</option>
{% endfor %}
</select>

<button class="btn-pro">Подключить</button>

</form>

{% endblock %}
