{% extends "base.html" %}
{% block content %}

<h2 class="mb-3">Подключения</h2>

<a href="/add_subscription" class="btn btn-primary mb-3 btn-modern">+ Подключить</a>

<div class="table-custom">
<table class="table mb-0 text-light">

<tr>
    <th>ID</th>
    <th>Клиент</th>
    <th>Услуга</th>
    <th>Дата</th>
    <th>Статус</th>
    <th></th>
</tr>

{% for s in subs %}
<tr>
    <td>{{ s.id }}</td>
    <td>{{ s.full_name }}</td>
    <td>{{ s.name }}</td>
    <td>{{ s.start_date }}</td>

    <td>
        {% if s.status == "Активна" %}
            <span class="status-active">Активна</span>
        {% else %}
            <span class="status-off">Отключена</span>
        {% endif %}
    </td>

    <td>
        <a href="/toggle_sub/{{ s.id }}" class="btn btn-warning btn-sm btn-modern">↻</a>
    </td>
</tr>
{% endfor %}

</table>
</div>

{% endblock %}
