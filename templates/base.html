<!DOCTYPE html>
<html>
<head>
    <title>Telecom System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #0f172a;
            color: #e2e8f0;
        }

        .sidebar {
            height: 100vh;
            width: 250px;
            position: fixed;
            background: #020617;
            padding-top: 20px;
        }

        .sidebar a {
            display: block;
            padding: 12px;
            color: #94a3b8;
            text-decoration: none;
        }

        .sidebar a:hover {
            background: #1e293b;
            color: white;
        }

        .content {
            margin-left: 260px;
            padding: 20px;
        }

        .card {
            border-radius: 15px;
        }
    </style>
</head>

<body>

<div class="sidebar">
    <h4 class="text-center text-light">Telecom</h4>
    <a href="/">Панель</a>
    <a href="/clients">Клиенты</a>
    <a href="/services">Услуги</a>
    <a href="/subscriptions">Подключения</a>
</div>

<div class="content">
    {% block content %}{% endblock %}
</div>

</body>
</html>
