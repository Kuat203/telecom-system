<!DOCTYPE html>
<html>
<head>
    <title>Telecom System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #0f172a;
            color: #e2e8f0;
            font-family: system-ui;
        }

        .sidebar {
            position: fixed;
            width: 240px;
            height: 100vh;
            background: #020617;
            padding: 20px;
        }

        .sidebar h4 {
            margin-bottom: 30px;
        }

        .sidebar a {
            display: block;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 8px;
            color: #94a3b8;
            text-decoration: none;
            transition: 0.2s;
        }

        .sidebar a:hover {
            background: #1e293b;
            color: white;
        }

        .content {
            margin-left: 260px;
            padding: 30px;
        }

        .card-custom {
            background: #1e293b;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .table-custom {
            background: #1e293b;
            border-radius: 12px;
            overflow: hidden;
        }

        .table-custom th {
            background: #020617;
            color: #94a3b8;
        }

        .table-custom td {
            vertical-align: middle;
        }

        .table-custom tr:hover {
            background: #334155;
        }

        .btn-modern {
            border-radius: 8px;
            padding: 6px 12px;
        }

        .status-active {
            background: #16a34a;
            padding: 5px 10px;
            border-radius: 8px;
        }

        .status-off {
            background: #dc2626;
            padding: 5px 10px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="sidebar">
    <h4 class="text-light">Telecom</h4>

    <a href="/">Панель</a>
    <a href="/clients">Клиенты</a>
    <a href="/services">Услуги</a>
    <a href="/subscriptions">Подключения</a>
    <a href="/payments">Платежи</a>
    <a href="/stats">Статистика</a>
</div>

<div class="content">
    {% block content %}{% endblock %}
</div>

</body>
</html>
