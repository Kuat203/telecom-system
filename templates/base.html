<!DOCTYPE html>
<html>
<head>
    <title>Telecom System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --bg-main: #0b1220;
            --bg-soft: #121a2b;
            --bg-card: #182235;
            --border: #1f2a40;
            --text-main: #e6edf7;
            --text-muted: #8b98b3;
            --accent: #3b82f6;
        }

        body {
            margin: 0;
            background: linear-gradient(180deg, #0b1220, #0f172a);
            color: var(--text-main);
            font-family: system-ui;
        }

        /* SIDEBAR */
        .sidebar {
            position: fixed;
            width: 240px;
            height: 100vh;
            background: rgba(10,15,30,0.9);
            backdrop-filter: blur(10px);
            border-right: 1px solid var(--border);
            padding: 20px;
        }

        .sidebar h4 {
            margin-bottom: 25px;
            font-weight: 600;
        }

        .sidebar a {
            display: block;
            padding: 10px 12px;
            margin-bottom: 6px;
            border-radius: 8px;
            color: var(--text-muted);
            text-decoration: none;
            transition: 0.2s;
        }

        .sidebar a:hover {
            background: var(--bg-soft);
            color: white;
        }

        /* CONTENT */
        .content {
            margin-left: 260px;
            padding: 40px;
            max-width: 1400px;
        }

        /* CARD */
        .card-pro {
            background: linear-gradient(145deg, #182235, #141c2c);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 22px;
            transition: 0.2s;
        }

        .card-pro:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        /* TABLE */
        .table-pro {
            width: 100%;
            border-collapse: collapse;
            overflow: hidden;
            border-radius: 12px;
            background: var(--bg-card);
        }

        .table-pro th {
            text-align: left;
            padding: 14px;
            background: #0f172a;
            color: var(--text-muted);
            font-weight: 500;
            border-bottom: 1px solid var(--border);
        }

        .table-pro td {
            padding: 14px;
            border-bottom: 1px solid var(--border);
        }

        .table-pro tr:hover {
            background: #1c2840;
        }

        /* BUTTON */
        .btn-pro {
            background: var(--accent);
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            color: white;
            transition: 0.2s;
        }

        .btn-pro:hover {
            opacity: 0.85;
        }

        .btn-danger-pro {
            background: #ef4444;
        }

        .btn-warning-pro {
            background: #f59e0b;
        }

        /* STATUS */
        .status {
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 13px;
        }

        .active {
            background: #16a34a;
        }

        .off {
            background: #dc2626;
        }
    </style>
</head>

<body>

<div class="sidebar">
    <h4>Telecom</h4>

    <a href="/">Панель</a>
    <a href="/clients">Клиенты</a>
    <a href="/tariffs">Тарифы</a>
    <a href="/subscriptions">Подключения</a>
    <a href="/payments">Платежи</a>
    <a href="/stats">Статистика</a>
</div>

<div class="content">
    {% block content %}{% endblock %}
</div>

</body>
</html>
