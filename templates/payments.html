{% extends "base.html" %}
{% block content %}

<h2>Платежи</h2>

<a href="/add_payment" class="btn btn-success mb-3">Добавить платеж</a>

<table class="table table-dark">
<tr>
    <th>ID</th>
    <th>Клиент</th>
    <th>Сумма</th>
    <th>Дата</th>
</tr>

{% for p in payments %}
<tr>
    <td>{{ p.id }}</td>
    <td>{{ p.full_name }}</td>
    <td>{{ p.amount }}</td>
    <td>{{ p.date }}</td>
</tr>
{% endfor %}

</table>

{% endblock %}
