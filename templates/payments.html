{% extends "base.html" %}
{% block content %}

<h2 class="mb-3">Платежи</h2>

<a href="/add_payment" class="btn btn-success mb-3 btn-modern">+ Платеж</a>

<div class="table-custom">
<table class="table mb-0 text-light">

<tr>
    <th>ID</th>
    <th>Клиент</th>
    <th>Сумма</th>
    <th>Дата</th>
</tr>

{% for p in payments %}
<tr>
    <td>{{ p.id }}</td>
    <td>{{ p.full_name }}</td>
    <td>{{ p.amount }} ₸</td>
    <td>{{ p.date }}</td>
</tr>
{% endfor %}

</table>
</div>

{% endblock %}
