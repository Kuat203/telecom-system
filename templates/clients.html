{% extends "base.html" %}

{% block content %}
<h2>Клиенты</h2>

<a href="/add_client" class="btn btn-success mb-3">Добавить</a>

<a href="/edit_client/{{ c.id }}" class="btn btn-warning btn-sm">Редактировать</a>

<form method="get" class="mb-3 d-flex">
    <input name="search" class="form-control me-2" placeholder="Поиск клиента">
    <button class="btn btn-primary">Найти</button>
</form>

<table class="table table-dark table-striped">
    <tr>
        <th>ID</th>
        <th>Имя</th>
        <th>Телефон</th>
        <th>Действия</th>
    </tr>

    {% for c in clients %}
    <tr>
        <td>{{ c.id }}</td>
        <td>{{ c.full_name }}</td>
        <td>{{ c.phone }}</td>
        <td>
            <a href="/delete_client/{{ c.id }}" class="btn btn-danger btn-sm">Удалить</a>
        </td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
